packages:
  - "apps/*"
  - "packages/*"

# Supply chain (architect's CI-04; settings checked against pnpm.io/10.x/settings).
# A dependency's install script runs only when it is listed here, and an unlisted one fails the install instead of
# being skipped in silence. esbuild's script only fetches its binary, which pnpm installs as an optional dependency.
strictDepBuilds: true
allowBuilds:
  esbuild: false
# A version is resolved only after it has been public for a day (minutes), long enough for most hijacked releases to be pulled.
minimumReleaseAge: 1440
# Advisories `pnpm audit` (.github/workflows/audit.yml) accepts (architect's CI-06). Both are high, have no patched
# release, and are reached only through the mobile toolchain (pnpm audit, 2026-10-14):
# node-forge via expo > @expo/cli, braces via tailwindcss > chokidar. Remove an entry once a fix ships, and look again
# if either one shows up on another path.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
