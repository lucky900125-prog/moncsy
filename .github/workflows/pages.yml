# Publishes the web PWA to GitHub Pages. There is no API on Pages, so the app runs in its
# built-in demo mode (sample data kept in the browser). One-time setup in the repo:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web for /<repo>/
        run: pnpm --filter @et/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # <account>.github.io is shared by all Pages sites of the account, so no caching service worker here
          # (see apps/web/vite.config.ts). Set "on" once the app has an origin of its own.
          PWA_SERVICE_WORKER: "off"
      # GitHub Pages serves 404.html for unknown paths, which lets deep links like /moncsy/tetelek load the SPA.
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
