name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API tests
        run: pnpm --filter @et/api test
      - name: API build
        run: pnpm --filter @et/api build
      - name: Web build
        run: pnpm --filter @et/web build
      - name: Mobile typecheck
        run: pnpm --filter @et/mobile typecheck
