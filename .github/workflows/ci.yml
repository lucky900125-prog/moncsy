name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API tests
        run: pnpm --filter @et/api test
      - name: API build
        run: pnpm --filter @et/api build
      # The build output is what production runs; start it once and require /api/health to answer.
      - name: API smoke test (built dist starts and serves /api/health)
        working-directory: apps/api
        env:
          PORT: "8787"
          DB_PATH: ${{ runner.temp }}/smoke.db
        run: |
          setsid pnpm start > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health; then echo; ok=1; break; fi
            sleep 1
          done
          kill -- "-$pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/smoke.log"
          test "$ok" = 1
      - name: Web build
        run: pnpm --filter @et/web build
      - name: Mobile typecheck
        run: pnpm --filter @et/mobile typecheck
