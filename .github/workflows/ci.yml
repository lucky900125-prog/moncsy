# Checks every push and pull request. On main, the web PWA is then published to GitHub Pages, and only once the checks
# have passed (architect's CI-01). There is no API on Pages, so the app runs in its built-in demo mode (sample data kept
# in the browser). One-time setup in the repo: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job may read the repository and nothing else, unless it asks for more itself (architect's CI-05).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # No job pushes, so the token is not left in the checkout's git config for later steps to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every action is pinned to the commit its release tag pointed to: a tag can be moved to other code, a commit cannot.
      # Dependabot's github-actions updates move the commit and the version comment together.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API tests
        run: pnpm --filter @et/api test
      - name: API build
        run: pnpm --filter @et/api build
      # The build output is what production runs; start it with render.yaml's own startCommand, read from there so the
      # two cannot drift apart (architect's FA-01), and require /api/health to answer.
      - name: API smoke test (built dist, started as render.yaml starts it, serves /api/health)
        env:
          PORT: "8787"
          DB_PATH: ${{ runner.temp }}/smoke.db
          # The API refuses to start without a named AI provider (on Render it is asked for, render.yaml).
          AI_PROVIDER: mock
        run: |
          start=$(sed -n 's/^ *startCommand: //p' render.yaml)
          test -n "$start"
          setsid sh -c "$start" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health; then echo; ok=1; break; fi
            sleep 1
          done
          kill -- "-$pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/smoke.log"
          test "$ok" = 1
      - name: Web build
        run: pnpm --filter @et/web build
      - name: Mobile typecheck
        run: pnpm --filter @et/mobile typecheck

  pages-build:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web for /<repo>/
        run: pnpm --filter @et/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # <account>.github.io is shared by all Pages sites of the account, so no caching service worker here
          # (see apps/web/vite.config.ts). Set "on" once the app has an origin of its own.
          PWA_SERVICE_WORKER: "off"
      # GitHub Pages serves 404.html for unknown paths, which lets deep links like /moncsy/tetelek load the SPA.
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    # The only job that writes anything: what actions/deploy-pages asks for, and nothing more.
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
