# Render Blueprint for the API on the free plan (https://render.com/docs/blueprint-spec).
# The free plan has no persistent disk: the SQLite file is restored from the encrypted GitHub backup on every
# start (apps/api/src/backup.ts). Setup steps: README.md, "Backend élesítése".
services:
  - type: web
    name: moncsy-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    # pnpm is pinned to the version in package.json "packageManager"; the lockfile needs pnpm 9 or newer.
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 --filter @et/api build
    startCommand: cd apps/api && node --conditions=et-dist --disable-warning=ExperimentalWarning dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://lucky900125-prog.github.io
      - key: DEFAULT_CURRENCY
        value: HUF
      # 256 random bits generated by Render; copy it from the dashboard into the app's settings.
      - key: API_TOKEN
        generateValue: true
      # The disk is wiped on every restart, so refuse to start without the backup rather than lose data quietly.
      - key: REQUIRE_BACKUP
        value: "1"
      # Asked for once, when the Blueprint is created; never stored in this file.
      - key: BACKUP_GITHUB_REPO
        sync: false
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      - key: BACKUP_KEY
        sync: false
      # Optional, can be added later in the dashboard: ANTHROPIC_API_KEY (or AI_PROVIDER + AI_API_KEY),
      # REVOLUT_BUSINESS_TOKEN. Without them the API runs with the offline mock AI and Revolut CSV import.
