# Render Blueprint for the API on the free plan (https://render.com/docs/blueprint-spec).
# The free plan has no persistent disk: the SQLite file is restored from the encrypted GitHub backup on every
# start (apps/api/src/backup.ts). Setup steps: README.md, "Backend élesítése".
services:
  - type: web
    name: moncsy-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # Once GitHub is connected to Render, `checksPass` here makes a deploy wait for CI on main (architect's CI-01).
    autoDeployTrigger: commit
    # Only a change that reaches the API deploys it. A deploy runs the old and the new instance side by side for a while,
    # and two instances writing stops the backup of one (apps/api/README.md, "Off-site backup"); a web-only push need
    # not risk that. The root manifest, lockfile, workspace file and .npmrc (node-linker) decide what the build installs.
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - render.yaml
        - .node-version
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .npmrc
    # pnpm is pinned to the version in package.json "packageManager"; the lockfile needs pnpm 9 or newer.
    # Only the API and what it depends on (about 191 MB instead of the whole workspace's 849 MB), each package with its
    # own dependencies (architect's FA-02).
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile --filter "@et/api..." --config.node-linker=isolated && npx --yes pnpm@10.28.0 --filter @et/api build
    # CI's smoke test starts the API with exactly this line (ci.yml). node runs directly, not through npm or a shell that
    # stays in between: SIGTERM has to reach it, or the last backup upload on shutdown never runs.
    startCommand: cd apps/api && exec node --conditions=et-dist dist/index.js
    healthCheckPath: /api/health
    # Node: the root .node-version file when there is one, else Render's default (24.x for services created after
    # 2026-09-17, render.com/docs/node-version). NODE_VERSION would override the file, so it is not set here.
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://lucky900125-prog.github.io
      - key: DEFAULT_CURRENCY
        value: HUF
      # 256 random bits generated by Render; copy it from the dashboard into the app's settings.
      - key: API_TOKEN
        generateValue: true
      # The disk is wiped on every restart, so refuse to start without the backup rather than lose data quietly.
      - key: REQUIRE_BACKUP
        value: "1"
      # Asked for once, when the Blueprint is created; never stored in this file.
      - key: BACKUP_GITHUB_REPO
        sync: false
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      - key: BACKUP_KEY
        sync: false
      # Optional, can be added later in the dashboard: ANTHROPIC_API_KEY (or AI_PROVIDER + AI_API_KEY),
      # REVOLUT_BUSINESS_TOKEN. Without them the API runs with the offline mock AI and Revolut CSV import.
